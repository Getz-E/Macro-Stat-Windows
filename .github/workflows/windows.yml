#
# GitHub Actions — Windows CI (Faz 5'te etkin).
# Bu dosya depo köküne `.github/workflows/windows.yml` olarak taşınır.
#
# İşler:
#   core       : Rust fmt / clippy / test + anahtar tablosu üretici kontrolü
#   gui-tests  : PyQt6 birim testleri (offscreen)
#   build      : motor + PyInstaller + Inno Setup + portatif ZIP + SHA-256
#   sign       : YALNIZCA SIGNING_ENABLED=true ise; ortam korumalı sırlar
#
# Hiçbir adım ağ üzerinden güncelleme/telemetri göndermez; yalnızca
# bağımlılık kurulumu ve artifact yüklemesi yapar.

name: windows

on:
  workflow_dispatch:
  # Haftalık bağımlılık/güvenlik taraması. `audit` işi bu koşuda engelleyicidir.
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "windows/**"
      - "ci/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "windows/**"
      - "ci/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QT_QPA_PLATFORM: offscreen

jobs:
  core:
    name: Engine core (fmt / clippy / test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # `gen_keymap.py` requires rustfmt on PATH; installing it explicitly
      # keeps the generator deterministic on the Windows runner.
      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt
      - name: Keymap generator is reproducible
        run: python tools/gen_keymap.py --check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  gui-tests:
    name: GUI unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/gui/requirements-win.txt
      - name: Install preflight dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Preflight (offline)
        run: python ci/preflight.py
      - name: Install dependencies
        run: python -m pip install -r windows/gui/requirements-win.txt
      - name: Run tests (offscreen)
        run: python -m unittest discover -s windows/tests -p "test_gui*.py" -v

  build:
    name: Build installer + portable ZIP
    needs: [core, gui-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            windows/gui/requirements-win.txt
            windows/gui/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r windows/gui/requirements-build.txt
      - name: Build everything
        run: powershell -ExecutionPolicy Bypass -File windows/scripts/build.ps1 -SkipTests
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macrostat-win-x64
          path: |
            windows/dist/MacroStat-Setup-*.exe
            windows/dist/MacroStat-*-portable.zip
            windows/dist/SHA256SUMS.txt
            windows/dist/MacroStat/**
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: E2E acceptance (real engine)
    needs: build
    runs-on: windows-latest
    env:
      MACROSTAT_E2E_ENGINE: windows/dist/MacroStat/_internal/macrostat-engine.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macrostat-win-x64
          path: windows/dist
      - name: Run E2E suite
        run: python -m unittest discover -s windows/tests -p "test_e2e*.py" -v

  audit:
    name: Dependency audit
    # Politika: pull request'te bilgilendirici (ilk katkıyı bir uyarı
    # yüzünden kilitlememek için), push / v* etiketi / haftalık schedule
    # koşularında ENGELLEYİCİ. Bulgular gizlenmez; PR dışındaki her
    # başarısızlık iş akışını kırar.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          cargo audit --deny warnings --file windows/engine/Cargo.lock
      - name: pip-audit
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit --strict -r windows/gui/requirements-win.txt

  sign:
    name: Sign artifacts (optional)
    needs: build
    # Never run with signing secrets on a pull request (fork or same-repo):
    # the checked-out tree and scripts would be attacker-controlled. Only
    # push to the repository or a manual dispatch may sign.
    if: >-
      ${{
        vars.SIGNING_ENABLED == 'true' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macrostat-win-x64
          path: windows/dist
      - name: Sign bundle executables
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "macrostat-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            & windows/scripts/sign.ps1 `
              -Files "windows/dist/MacroStat/MacroStat.exe",
                     "windows/dist/MacroStat/_internal/macrostat-engine.exe" `
              -PfxPath $pfx -PfxPassword $env:PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
      - name: Repack signed portable ZIP and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "windows/VERSION" -Raw).Trim()
          $dist = "windows/dist"
          Get-ChildItem $dist -Filter "MacroStat-Setup-*.exe" | Remove-Item -Force
          Compress-Archive -Path "$dist/MacroStat/*" `
            -DestinationPath "$dist/MacroStat-$version-portable.zip" -Force
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "windows/installer/MacroStat.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$dist/MacroStat-Setup-$version.exe")) {
            throw "Installer output missing after repack."
          }
      - name: Sign installer
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "macrostat-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $setup = Get-ChildItem "windows/dist" -Filter "MacroStat-Setup-*.exe" | Select-Object -First 1
            if (-not $setup) { throw "Installer not found; repack step must run first." }
            & windows/scripts/sign.ps1 -Files $setup.FullName -PfxPath $pfx -PfxPassword $env:PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
      - name: Rebuild checksums after signing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "windows/dist"
          $files = Get-ChildItem $dist -File |
            Where-Object { $_.Extension -eq ".exe" -or $_.Extension -eq ".zip" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $f.Name
          }
          Set-Content -LiteralPath "$dist/SHA256SUMS.txt" -Value $lines -Encoding ascii
      - name: Verify signed release
        run: powershell -ExecutionPolicy Bypass -File windows/scripts/verify.ps1 -RequireSignature
      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macrostat-win-x64-signed
          path: |
            windows/dist/MacroStat-Setup-*.exe
            windows/dist/MacroStat-*-portable.zip
            windows/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
